<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome video</title>
<style>html,body{margin:0;background:#000;height:100%}video{display:block;width:100%;height:100%;object-fit:contain}</style>
</head>
<body>
<!-- Player for embedding in Canvas. The captions file must come from the same site as the page, so Canvas embeds this page in an iframe. -->
<video controls playsinline preload="metadata" title="Welcome video from your instructor">
  <source src="../videos/welcome.mp4" type="video/mp4">
  <track kind="captions" src="../videos/welcome.vtt" srclang="en" label="English" default>
  Your browser cannot play this video. Use the transcript instead.
</video>
</body>
</html>
